<!DOCTYPE html>
<html>
<head>
<title>Register</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="h-screen flex items-center justify-center bg-gradient-to-br from-green-500 via-teal-500 to-blue-600">

<div class="bg-white/20 backdrop-blur-xl p-8 rounded-2xl shadow-2xl w-96 border border-white/30">

<h2 class="text-white text-3xl font-bold text-center mb-6">Create Account</h2>

<form method="POST" class="space-y-4">

<input class="w-full p-3 rounded-lg bg-white/80" name="name" placeholder="Name">

<input class="w-full p-3 rounded-lg bg-white/80" name="email" placeholder="Email">

<input class="w-full p-3 rounded-lg bg-white/80" type="password" name="password" placeholder="Password">

<button class="w-full bg-black text-white p-3 rounded-lg hover:scale-105 transition">
Register
</button>

</form>

</div>

</body>
</html>
