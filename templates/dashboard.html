<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-gray-900 via-blue-900 to-black text-white">

<div class="p-10">

<h1 class="text-4xl font-bold mb-8">AI Resume Dashboard ⚡</h1>

<div class="grid grid-cols-2 gap-6">

<div class="bg-white/10 p-6 rounded-xl backdrop-blur-lg border border-white/20 hover:scale-105 transition">
<h2 class="text-xl">Total Users</h2>
<p class="text-3xl font-bold">{{ total_users }}</p>
</div>

<div class="bg-white/10 p-6 rounded-xl backdrop-blur-lg border border-white/20 hover:scale-105 transition">
<h2 class="text-xl">Total Resumes</h2>
<p class="text-3xl font-bold">{{ total_resumes }}</p>
</div>

</div>

<div class="mt-10 flex gap-4">

<a href="/resume" class="bg-purple-500 px-6 py-3 rounded-xl hover:scale-105 transition">
Create Resume
</a>

<a href="/versions" class="bg-blue-500 px-6 py-3 rounded-xl hover:scale-105 transition">
View Versions
</a>

</div>

</div>

</body>
</html>
