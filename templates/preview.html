<!DOCTYPE html>
<html>

<head>

    <title>Resume Preview</title>

    <style>

        body{
            font-family: Arial;
            background-color: #f0f2f5;
            padding: 40px;
        }

        .resume-box{
            width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        img{
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid darkblue;
        }

        h1{
            color: darkblue;
            margin-top: 10px;
        }

        h2{
            color: #333;
        }

        hr{
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .template{
            color: green;
            font-weight: bold;
        }

        .version{
            color: gray;
        }

        .btn{
            text-decoration: none;
            background-color: darkblue;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
        }

        .btn:hover{
            background-color: black;
        }

    </style>

</head>

<body>

<div class="resume-box">

    <center>

        <img
        src="/static/uploads/{{ resume[5] }}"
        alt="Profile Photo"
        >

        <h1>{{ resume[1] }}</h1>

        <p class="template">
            Template :
            {{ resume[6] }}
        </p>

    </center>

    <hr>

    <h2>Skills</h2>

    <p>{{ resume[2] }}</p>

    <hr>

    <h2>Education</h2>

    <p>{{ resume[3] }}</p>

    <hr>

    <h2>Experience</h2>

    <p>{{ resume[4] }}</p>

    <hr>

    <h3 class="version">
        Resume Version :
        {{ resume[7] }}
    </h3>

    <br>

    <a
    href="/versions"
    class="btn"
    >
        Back to Versions
    </a>

</div>

</body>
</html>
