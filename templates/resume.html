<!DOCTYPE html>
<html>

<head>
<title>AI Resume Builder</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
    background: linear-gradient(135deg, #0f172a, #1e1b4b, #312e81);
}
.glass {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.15);
}
</style>
</head>

<body class="text-white p-8">

<div class="max-w-4xl mx-auto glass p-8 rounded-2xl shadow-2xl">

<h1 class="text-3xl font-bold text-center mb-6">
AI Resume Builder 🚀
</h1>

<form method="POST" enctype="multipart/form-data" id="form" class="space-y-4">

<!-- BASIC INFO -->
<div class="grid grid-cols-2 gap-4">

<input name="name" placeholder="Full Name" class="p-3 rounded-xl text-black">

<input name="email" placeholder="Email" class="p-3 rounded-xl text-black">

<input name="phone" placeholder="Phone Number" class="p-3 rounded-xl text-black">

<input name="location" placeholder="Location" class="p-3 rounded-xl text-black">

</div>

<!-- LINKS -->
<div class="grid grid-cols-1 gap-4">

<input name="linkedin" placeholder="LinkedIn URL" class="p-3 rounded-xl text-black">

<textarea name="objective" placeholder="Career Objective / Summary"
class="p-3 rounded-xl text-black"></textarea>

</div>

<!-- MAIN CONTENT -->
<textarea name="skills" placeholder="Skills (Python, Java, etc)"
class="w-full p-3 rounded-xl text-black"></textarea>

<textarea name="education" placeholder="Education"
class="w-full p-3 rounded-xl text-black"></textarea>

<textarea name="experience" placeholder="Experience"
class="w-full p-3 rounded-xl text-black"></textarea>

<!-- TEMPLATE -->
<select name="template" class="w-full p-3 rounded-xl text-black">
<option>AI Modern</option>
<option>Cyber Glass</option>
<option>Dark Pro</option>
</select>

<!-- PHOTO -->
<input type="file" name="photo" class="w-full">

<!-- BUTTON -->
<button class="w-full bg-gradient-to-r from-pink-500 to-purple-500 p-3 rounded-xl hover:scale-105 transition font-bold">
Generate AI Resume
</button>

</form>

<p class="text-center text-sm mt-4 text-gray-300">
Auto-saving every 5 minutes 🤖 | AI-enhanced builder
</p>

</div>

</body>
</html>
