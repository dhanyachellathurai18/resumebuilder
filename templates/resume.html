<!DOCTYPE html>
<html>
<head>
    <title>Resume Builder</title>
</head>
<body>

<h1>Create Resume</h1>

<hr>

<form method="POST" enctype="multipart/form-data">

    <input
        type="text"
        name="name"
        placeholder="Enter Name"
        required
    >

    <br><br>

    <textarea
        name="skills"
        placeholder="Enter Skills"
        required
    ></textarea>

    <br><br>

    <textarea
        name="education"
        placeholder="Enter Education"
        required
    ></textarea>

    <br><br>

    <textarea
        name="experience"
        placeholder="Enter Experience"
        required
    ></textarea>

    <br><br>

    <label>Upload Profile Photo:</label>

    <input
        type="file"
        name="photo"
        required
    >

    <br><br>

    <button type="submit">
        Save Resume
    </button>

</form>

<br>

<a href="/dashboard">
    Back to Dashboard
</a>

</body>
</html>
