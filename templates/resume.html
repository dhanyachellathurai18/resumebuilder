<!DOCTYPE html>
<html>

<head>
    <title>Resume Builder</title>
</head>

<body>

    <h1>Create Resume</h1>
    <hr>

    <form method="POST" enctype="multipart/form-data">

        <input 
            type="text"
            name="name"
            placeholder="Enter Name"
            required
        >

        <br><br>

        <textarea
            name="skills"
            placeholder="Enter Skills"
            required
        ></textarea>

        <br><br>

        <textarea
            name="education"
            placeholder="Enter Education"
            required
        ></textarea>

        <br><br>

        <textarea
            name="experience"
            placeholder="Enter Experience"
            required
        ></textarea>

        <br><br>

        <!-- Template Selection -->
        <label>Select Template:</label>

        <select name="template" required>
            <option value="Modern">Modern</option>
            <option value="Professional">Professional</option>
            <option value="Classic">Classic</option>
        </select>

        <br><br>

        <!-- Photo Upload -->
        <label>Upload Profile Photo:</label>

        <input 
            type="file"
            name="photo"
            accept="image/*"
            required
        >

        <br><br>

        <button type="submit">
            Save Resume
        </button>

    </form>

    <br>

    <a href="/dashboard">
        Back to Dashboard
    </a>

</body>

</html>
