<!DOCTYPE html>
<html>
<head>
    <title>Resume Builder</title>
</head>
<body>

<h1>Resume Builder</h1>

<hr>

<a href="/dashboard">Dashboard</a> |
<a href="/versions">View Versions</a>

<hr>

<form method="POST">

    <h3>Name</h3>
    <input type="text" name="name" required>

    <h3>Skills</h3>
    <textarea name="skills" rows="5" cols="40"></textarea>

    <h3>Education</h3>
    <textarea name="education" rows="5" cols="40"></textarea>

    <h3>Experience</h3>
    <textarea name="experience" rows="5" cols="40"></textarea>

    <br><br>

    <button type="submit">
        Save Resume
    </button>

</form>

</body>
</html>
